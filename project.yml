name: FindMyFriends

options:
  bundleIdPrefix: com.pixelatedstudios
  deploymentTarget:
    iOS: "17.0"

targets:
  App:
    type: application
    platform: iOS

    entitlements:
      path: App.entitlements

    dependencies:
      - sdk: HealthKit.framework
      - sdk: Contacts.framework
      - sdk: MapKit.framework
      - sdk: CoreLocation.framework
      - sdk: MusicKit.framework
      - sdk: MediaPlayer.framework
      - target: FindMyFriendsLiveActivity

    sources:
      - path: lib/App
      - path: lib/Shared
      - path: Assets.xcassets

    settings:
      base:
        PRODUCT_NAME: FindMyFriends
        PRODUCT_BUNDLE_IDENTIFIER: com.pixelatedstudios.findmyfriends
        SWIFT_VERSION: 5.0
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"

  FindMyFriendsLiveActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      - path: lib/LiveActivity
      - path: lib/Shared

    dependencies:
      - sdk: ActivityKit.framework
      - sdk: WidgetKit.framework

    settings:
      base:
        PRODUCT_NAME: FindMyFriendsLiveActivity
        PRODUCT_BUNDLE_IDENTIFIER: com.pixelatedstudios.findmyfriends.liveactivity
        SWIFT_VERSION: 5.0
        INFOPLIST_FILE: lib/LiveActivity/Info.plist
        SKIP_INSTALL: YES
